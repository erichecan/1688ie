<!DOCTYPE html>
<!--
  组件：在线预约（Booking）
  用途：可复用组件库 · 六块之一，供拼装行业 demo 用（美甲/美睫、私教/瑜伽、美容院等预约类业态）

  怎么改成新行业：
  1. 顶部 :root 里的 --brand / --brand-light / --brand-dark 三个变量换成客户品牌色
  2. SHOP 对象（脚本区最上面）改店名、logo 文字、货币符号
  3. SERVICES 数组改成客户的实际服务项目（名称/时长/价格）
  4. STAFF 数组改成客户的技师/教练名单，不需要「选人」这一步就把 STAFF 设为空数组，第 3 步会自动跳过
  5. 文案统一走 data-zh / data-en 双属性，改中文改 data-zh，改英文改 data-en，两个都要改
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线预约组件 · 1688.ie</title>
<style>
  :root {
    --brand: #0d4f3c;
    --brand-light: #e8f3ef;
    --brand-dark: #093a2c;
    --ink: #1c1917;
    --gray: #78716c;
    --line: #e7e5e4;
    --bg: #fafaf9;
    --card: #ffffff;
    --radius: 14px;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  /* ── 头部 ── */
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .shop-name { font-weight: 800; font-size: 1.05rem; color: var(--brand-dark); }
  .lang-btn {
    font-size: 0.78rem; font-weight: 700; color: var(--brand);
    border: 1px solid var(--brand); border-radius: 99px;
    padding: 4px 12px; cursor: pointer; background: var(--card);
  }

  /* ── 步骤条 ── */
  .steps { display: flex; gap: 6px; margin-bottom: 20px; }
  .step-dot { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background .2s; }
  .step-dot.done, .step-dot.active { background: var(--brand); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 14px;
  }
  .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 12px; color: var(--ink); }
  .card-title .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%; background: var(--brand);
    color: #fff; font-size: 0.72rem; margin-right: 8px;
  }

  /* ── 服务选择 ── */
  .svc-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; border: 1.5px solid var(--line); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .svc-item:last-child { margin-bottom: 0; }
  .svc-item.selected { border-color: var(--brand); background: var(--brand-light); }
  .svc-name { font-weight: 600; font-size: 0.88rem; }
  .svc-meta { font-size: 0.76rem; color: var(--gray); margin-top: 2px; }
  .svc-price { font-weight: 700; color: var(--brand-dark); font-size: 0.9rem; white-space: nowrap; }

  /* ── 日期选择 ── */
  .date-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .date-cell {
    flex: 0 0 56px; text-align: center; padding: 10px 0; border-radius: 10px;
    border: 1.5px solid var(--line); cursor: pointer; user-select: none;
  }
  .date-cell.selected { border-color: var(--brand); background: var(--brand); color: #fff; }
  .date-cell .dow { font-size: 0.68rem; color: inherit; opacity: .75; }
  .date-cell .dom { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
  .date-cell.disabled { opacity: .35; pointer-events: none; }

  /* ── 时间段 ── */
  .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot-cell {
    text-align: center; padding: 9px 0; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
    border: 1.5px solid var(--line); cursor: pointer;
  }
  .slot-cell.selected { border-color: var(--brand); background: var(--brand); color: #fff; }
  .slot-cell.full { opacity: .3; pointer-events: none; text-decoration: line-through; }

  /* ── 技师选择 ── */
  .staff-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .staff-item { text-align: center; cursor: pointer; padding: 8px 6px; border-radius: 10px; border: 1.5px solid transparent; width: 76px; }
  .staff-item.selected { border-color: var(--brand); background: var(--brand-light); }
  .staff-avatar {
    width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px;
    background: var(--brand-light); color: var(--brand-dark); font-weight: 800;
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
  }
  .staff-name { font-size: 0.74rem; font-weight: 600; }

  /* ── 表单 ── */
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 0.78rem; color: var(--gray); margin-bottom: 5px; font-weight: 600; }
  .field input {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px;
    font-size: 0.88rem; font-family: inherit;
  }
  .field input:focus { outline: none; border-color: var(--brand); }
  .field-error { font-size: 0.74rem; color: var(--danger); margin-top: 4px; display: none; }

  /* ── 汇总 & 按钮 ── */
  .summary-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 6px 0; }
  .summary-row.total { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; font-weight: 800; font-size: 0.95rem; }
  .btn {
    display: block; width: 100%; text-align: center; padding: 13px; border-radius: 10px;
    font-weight: 700; font-size: 0.92rem; border: none; cursor: pointer;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:disabled { background: var(--line); color: var(--gray); cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--gray); margin-top: 8px; }

  /* ── 完成页 ── */
  .done-wrap { text-align: center; padding: 30px 10px; }
  .done-icon {
    width: 64px; height: 64px; border-radius: 50%; background: var(--brand-light); color: var(--brand);
    display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 16px;
  }
  .done-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 4px; }
  .done-sub { font-size: 0.84rem; color: var(--gray); margin-bottom: 20px; }
  .code-box {
    background: var(--brand-light); border-radius: 10px; padding: 12px; margin-bottom: 8px;
    font-family: 'SFMono-Regular', Menlo, monospace; font-weight: 700; letter-spacing: 2px; color: var(--brand-dark);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="shop-name" id="shopName"></div>
    <div class="lang-btn" onclick="toggleLang()">ZH / EN</div>
  </div>

  <div class="steps">
    <div class="step-dot" data-step="1"></div>
    <div class="step-dot" data-step="2"></div>
    <div class="step-dot" data-step="3"></div>
    <div class="step-dot" data-step="4"></div>
  </div>

  <!-- ============ 第一步：选服务 ============ -->
  <section id="step-1">
    <div class="card">
      <div class="card-title"><span class="num">1</span><span data-zh="选择服务项目" data-en="Choose a Service">选择服务项目</span></div>
      <div id="svcList"></div>
    </div>
  </section>

  <!-- ============ 第二步：选日期 + 时段 + 技师 ============ -->
  <section id="step-2" class="hidden">
    <div class="card">
      <div class="card-title"><span class="num">2</span><span data-zh="选择日期" data-en="Choose a Date">选择日期</span></div>
      <div class="date-row" id="dateRow"></div>
    </div>
    <div class="card">
      <div class="card-title"><span data-zh="选择时段" data-en="Choose a Time">选择时段</span></div>
      <div class="slot-grid" id="slotGrid"></div>
    </div>
    <div class="card" id="staffCard">
      <div class="card-title"><span data-zh="选择技师（可选）" data-en="Choose Staff (optional)">选择技师（可选）</span></div>
      <div class="staff-row" id="staffRow"></div>
    </div>
    <button class="btn btn-primary" id="toStep3Btn" onclick="goStep(3)" disabled data-zh="下一步" data-en="Next">下一步</button>
    <button class="btn btn-ghost" onclick="goStep(1)" data-zh="上一步" data-en="Back">上一步</button>
  </section>

  <!-- ============ 第三步：填资料 ============ -->
  <section id="step-3" class="hidden">
    <div class="card">
      <div class="card-title"><span class="num">3</span><span data-zh="填写联系方式" data-en="Your Details">填写联系方式</span></div>
      <div class="field">
        <label data-zh="姓名" data-en="Name">姓名</label>
        <input type="text" id="custName" data-zh-ph="怎么称呼您" data-en-ph="Your name">
        <div class="field-error" id="errName" data-zh="请填写姓名" data-en="Please enter your name">请填写姓名</div>
      </div>
      <div class="field">
        <label data-zh="手机号" data-en="Phone">手机号</label>
        <input type="tel" id="custPhone" data-zh-ph="用于发送预约提醒" data-en-ph="For booking reminders">
        <div class="field-error" id="errPhone" data-zh="请填写有效手机号" data-en="Please enter a valid phone number">请填写有效手机号</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span data-zh="预约摘要" data-en="Booking Summary">预约摘要</span></div>
      <div id="summaryBox"></div>
    </div>
    <button class="btn btn-primary" onclick="submitBooking()" data-zh="确认预约" data-en="Confirm Booking">确认预约</button>
    <button class="btn btn-ghost" onclick="goStep(2)" data-zh="上一步" data-en="Back">上一步</button>
  </section>

  <!-- ============ 第四步：完成 ============ -->
  <section id="step-4" class="hidden">
    <div class="card done-wrap">
      <div class="done-icon">✓</div>
      <div class="done-title" data-zh="预约成功" data-en="Booking Confirmed">预约成功</div>
      <div class="done-sub" data-zh="已发送短信提醒到您的手机" data-en="A reminder SMS has been sent to your phone">已发送短信提醒到您的手机</div>
      <div class="code-box" id="bookingCode"></div>
      <div id="finalSummary" style="text-align:left; margin-top:16px;"></div>
    </div>
    <button class="btn btn-primary" onclick="resetBooking()" data-zh="再预约一次" data-en="Book Another">再预约一次</button>
  </section>

</div>

<script>
  /* ── 可替换配置区：换行业只改这里 ── */
  const SHOP = { nameZh: '示例美甲工作室', nameEn: 'Sample Nail Studio', currency: '€' };

  const SERVICES = [
    { id: 's1', zh: '基础美甲', en: 'Classic Manicure', mins: 45, price: 35 },
    { id: 's2', zh: '光疗甲', en: 'Gel Polish', mins: 60, price: 45 },
    { id: 's3', zh: '延长甲 + 手绘', en: 'Extensions + Nail Art', mins: 90, price: 68 },
  ];

  const STAFF = [
    { id: 'p1', zh: '不指定', en: 'No preference' },
    { id: 'p2', zh: '阿May', en: 'May' },
    { id: 'p3', zh: 'Tina', en: 'Tina' },
  ];

  const SLOTS = ['10:00','11:00','12:00','13:30','14:30','15:30','16:30','17:30','18:30'];
  const FULL_SLOTS = ['12:00','16:30']; // mock 已被约满的时段

  /* ── 状态 ── */
  let currentLang = 'zh';
  const state = { service: null, dateIdx: 0, slot: null, staff: STAFF[0].id, name: '', phone: '', code: null };

  function t(zh, en) { return currentLang === 'zh' ? zh : en; }

  /* ── 渲染：服务列表 ── */
  function renderServices() {
    const box = document.getElementById('svcList');
    box.innerHTML = SERVICES.map(s => `
      <div class="svc-item ${state.service === s.id ? 'selected' : ''}" onclick="selectService('${s.id}')">
        <div>
          <div class="svc-name">${t(s.zh, s.en)}</div>
          <div class="svc-meta">${s.mins} ${t('分钟', 'min')}</div>
        </div>
        <div class="svc-price">${SHOP.currency}${s.price}</div>
      </div>
    `).join('');
  }
  function selectService(id) {
    state.service = id;
    renderServices();
    goStep(2);
  }

  /* ── 渲染：日期（未来 7 天） ── */
  const DOW_ZH = ['日','一','二','三','四','五','六'];
  const DOW_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function buildDates() {
    // mock：用固定基准日避免依赖 Date.now()，仅展示相对天数
    const base = { dow: 2, dom: 25 }; // 周二 25 号
    const dates = [];
    for (let i = 0; i < 7; i++) {
      dates.push({ dow: (base.dow + i) % 7, dom: base.dom + i });
    }
    return dates;
  }
  const DATES = buildDates();
  function renderDates() {
    const row = document.getElementById('dateRow');
    row.innerHTML = DATES.map((d, i) => `
      <div class="date-cell ${state.dateIdx === i ? 'selected' : ''}" onclick="selectDate(${i})">
        <div class="dow">${t(DOW_ZH[d.dow], DOW_EN[d.dow])}</div>
        <div class="dom">${d.dom}</div>
      </div>
    `).join('');
  }
  function selectDate(i) { state.dateIdx = i; state.slot = null; renderDates(); renderSlots(); updateStep2Btn(); }

  /* ── 渲染：时段 ── */
  function renderSlots() {
    const grid = document.getElementById('slotGrid');
    grid.innerHTML = SLOTS.map(s => {
      const full = FULL_SLOTS.includes(s);
      return `<div class="slot-cell ${state.slot === s ? 'selected' : ''} ${full ? 'full' : ''}"
                onclick="${full ? '' : `selectSlot('${s}')`}">${s}</div>`;
    }).join('');
  }
  function selectSlot(s) { state.slot = s; renderSlots(); updateStep2Btn(); }

  /* ── 渲染：技师 ── */
  function renderStaff() {
    if (!STAFF.length) { document.getElementById('staffCard').classList.add('hidden'); return; }
    const row = document.getElementById('staffRow');
    row.innerHTML = STAFF.map(p => `
      <div class="staff-item ${state.staff === p.id ? 'selected' : ''}" onclick="selectStaff('${p.id}')">
        <div class="staff-avatar">${t(p.zh, p.en).slice(0,1)}</div>
        <div class="staff-name">${t(p.zh, p.en)}</div>
      </div>
    `).join('');
  }
  function selectStaff(id) { state.staff = id; renderStaff(); }

  function updateStep2Btn() {
    document.getElementById('toStep3Btn').disabled = !(state.slot);
  }

  /* ── 渲染：摘要 ── */
  function svcById(id) { return SERVICES.find(s => s.id === id); }
  function staffById(id) { return STAFF.find(p => p.id === id); }
  function summaryHTML() {
    const s = svcById(state.service);
    const d = DATES[state.dateIdx];
    const p = staffById(state.staff);
    return `
      <div class="summary-row"><span>${t('服务','Service')}</span><span>${t(s.zh, s.en)}</span></div>
      <div class="summary-row"><span>${t('时间','Time')}</span><span>${d.dom} ${t('日','')} ${state.slot}</span></div>
      ${p ? `<div class="summary-row"><span>${t('技师','Staff')}</span><span>${t(p.zh, p.en)}</span></div>` : ''}
      <div class="summary-row total"><span>${t('预计费用','Estimated Total')}</span><span>${SHOP.currency}${s.price}</span></div>
    `;
  }

  /* ── 步骤切换 ── */
  function goStep(n) {
    [1,2,3,4].forEach(i => document.getElementById('step-' + i).classList.toggle('hidden', i !== n));
    document.querySelectorAll('.step-dot').forEach(dot => {
      const i = Number(dot.dataset.step);
      dot.classList.toggle('active', i === n);
      dot.classList.toggle('done', i < n);
    });
    if (n === 2) { renderDates(); renderSlots(); renderStaff(); updateStep2Btn(); }
    if (n === 3) { document.getElementById('summaryBox').innerHTML = summaryHTML(); }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ── 提交 ── */
  function submitBooking() {
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const nameOk = name.length > 0;
    const phoneOk = /^[\d+\-\s]{6,}$/.test(phone);
    document.getElementById('errName').style.display = nameOk ? 'none' : 'block';
    document.getElementById('errPhone').style.display = phoneOk ? 'none' : 'block';
    if (!nameOk || !phoneOk) return;

    state.name = name; state.phone = phone;
    state.code = 'BK' + Math.abs(hashCode(name + phone + state.slot)).toString().slice(0, 6);
    document.getElementById('bookingCode').textContent = t('预约码 ', 'Booking Code ') + state.code;
    document.getElementById('finalSummary').innerHTML = summaryHTML();
    goStep(4);
  }
  function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
    return h;
  }

  function resetBooking() {
    state.service = null; state.dateIdx = 0; state.slot = null; state.staff = STAFF[0]?.id || null; state.code = null;
    document.getElementById('custName').value = '';
    document.getElementById('custPhone').value = '';
    renderServices();
    goStep(1);
  }

  /* ── 语言切换 ── */
  function toggleLang() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    document.documentElement.lang = currentLang;
    document.getElementById('shopName').textContent = t(SHOP.nameZh, SHOP.nameEn);
    document.querySelectorAll('[data-zh][data-en]').forEach(el => {
      el.textContent = currentLang === 'zh' ? el.dataset.zh : el.dataset.en;
    });
    document.querySelectorAll('[data-zh-ph]').forEach(el => {
      el.placeholder = currentLang === 'zh' ? el.dataset.zhPh : el.dataset.enPh;
    });
    renderServices();
    // 重新渲染当前所在的动态区块（若已进入对应步骤）
    if (!document.getElementById('step-2').classList.contains('hidden')) { renderDates(); renderSlots(); renderStaff(); }
    if (!document.getElementById('step-3').classList.contains('hidden')) { document.getElementById('summaryBox').innerHTML = summaryHTML(); }
    if (!document.getElementById('step-4').classList.contains('hidden')) {
      document.getElementById('bookingCode').textContent = t('预约码 ', 'Booking Code ') + state.code;
      document.getElementById('finalSummary').innerHTML = summaryHTML();
    }
  }

  /* ── 初始化 ── */
  document.getElementById('shopName').textContent = SHOP.nameZh;
  renderServices();
  goStep(1);
</script>
</body>
</html>
