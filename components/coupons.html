<!DOCTYPE html>
<!--
  组件：优惠券（Coupons）
  用途：可复用组件库 · 六块之一，供拼装行业 demo 用（餐馆、美甲/美睫、零售等发券促销业态）

  怎么改成新行业：
  1. 顶部 :root 里的 --brand / --brand-light / --brand-dark 三个变量换成客户品牌色
  2. SHOP 对象（脚本区最上面）改店名、货币符号
  3. COUPONS 数组改成客户实际要发的券（满减/折扣/兑换三种 kind 任选组合）
  4. MY_SEED 数组是为了演示「已使用/已过期」视觉状态预置的两条记录，实际接入时可去掉，改成真实已发券记录
  5. 文案统一走 data-zh / data-en 双属性，改中文改 data-zh，改英文改 data-en，两个都要改
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优惠券组件 · 1688.ie</title>
<style>
  :root {
    --brand: #0d4f3c;
    --brand-light: #e8f3ef;
    --brand-dark: #093a2c;
    --ink: #1c1917;
    --gray: #78716c;
    --line: #e7e5e4;
    --bg: #fafaf9;
    --card: #ffffff;
    --radius: 14px;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  /* ── 头部 ── */
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .shop-name { font-weight: 800; font-size: 1.05rem; color: var(--brand-dark); }
  .lang-btn {
    font-size: 0.78rem; font-weight: 700; color: var(--brand);
    border: 1px solid var(--brand); border-radius: 99px;
    padding: 4px 12px; cursor: pointer; background: var(--card);
  }

  /* ── Tab 切换 ── */
  .tab-bar { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1; text-align: center; padding: 10px; border-radius: 10px;
    font-weight: 700; font-size: 0.86rem; border: 1.5px solid var(--line);
    background: var(--card); cursor: pointer; color: var(--gray);
  }
  .tab-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }

  .group-title { font-size: 0.78rem; font-weight: 700; color: var(--gray); margin: 16px 0 8px; }
  .group-title:first-child { margin-top: 0; }
  .empty-tip { font-size: 0.82rem; color: var(--gray); text-align: center; padding: 20px 0; }

  /* ── 优惠券卡片 ── */
  .coupon-card {
    display: flex; border: 1.5px solid var(--line); border-radius: 12px;
    overflow: hidden; margin-bottom: 10px; background: var(--card); position: relative;
  }
  .coupon-left {
    flex: 0 0 96px; background: var(--brand); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 10px 6px; border-right: 1.5px dashed rgba(255,255,255,.5);
  }
  .coupon-left .amt-num { font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
  .coupon-left .amt-unit { font-size: 0.68rem; opacity: .85; margin-top: 2px; }
  .coupon-right { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .coupon-title { font-weight: 700; font-size: 0.9rem; }
  .coupon-meta { font-size: 0.72rem; color: var(--gray); }
  .coupon-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .coupon-expiry { font-size: 0.7rem; color: var(--gray); }
  .coupon-btn {
    padding: 6px 16px; border-radius: 99px; font-size: 0.78rem; font-weight: 700;
    border: none; cursor: pointer; background: var(--brand); color: #fff; white-space: nowrap;
  }
  .coupon-btn:disabled { background: var(--line); color: var(--gray); cursor: not-allowed; }

  .coupon-card.disabled .coupon-left { background: var(--gray); }
  .coupon-card.disabled { opacity: .6; }
  .stamp {
    position: absolute; top: 10px; right: 12px; border: 2px solid var(--gray); color: var(--gray);
    font-weight: 800; font-size: 0.68rem; padding: 2px 8px; border-radius: 6px;
    transform: rotate(14deg); letter-spacing: 1px;
  }

  /* ── 弹窗 ── */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal-box { background: var(--card); border-radius: 16px; padding: 26px 22px; max-width: 340px; width: 100%; text-align: center; }
  .modal-title { font-weight: 800; font-size: 1rem; margin-bottom: 4px; }
  .modal-sub { font-size: 0.8rem; color: var(--gray); margin-bottom: 16px; }
  .modal-code {
    font-family: 'SFMono-Regular', Menlo, monospace; font-size: 1.8rem; font-weight: 800;
    letter-spacing: 6px; color: var(--brand-dark); background: var(--brand-light);
    border-radius: 12px; padding: 16px; margin-bottom: 18px;
  }
  .btn {
    display: block; width: 100%; text-align: center; padding: 12px; border-radius: 10px;
    font-weight: 700; font-size: 0.88rem; border: none; cursor: pointer;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-ghost { background: transparent; color: var(--gray); margin-top: 8px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="shop-name" id="shopName"></div>
    <div class="lang-btn" onclick="toggleLang()">ZH / EN</div>
  </div>

  <div class="tab-bar">
    <div class="tab-btn active" id="tabBtn-center" onclick="switchTab('center')" data-zh="领券中心" data-en="Get Coupons">领券中心</div>
    <div class="tab-btn" id="tabBtn-mine" onclick="switchTab('mine')" data-zh="我的优惠券" data-en="My Coupons">我的优惠券</div>
  </div>

  <!-- ============ 领券中心 ============ -->
  <section id="tab-center">
    <div id="centerList"></div>
  </section>

  <!-- ============ 我的优惠券 ============ -->
  <section id="tab-mine" class="hidden">
    <div id="mineList"></div>
  </section>

</div>

<!-- ============ 核销弹窗 ============ -->
<div class="modal-mask hidden" id="redeemModal">
  <div class="modal-box">
    <div class="modal-title" data-zh="出示给店员扫码核销" data-en="Show this to staff to redeem">出示给店员扫码核销</div>
    <div class="modal-sub" id="modalCouponTitle"></div>
    <div class="modal-code" id="modalCode"></div>
    <button class="btn btn-primary" onclick="confirmRedeem()" data-zh="确认核销" data-en="Confirm Redemption">确认核销</button>
    <button class="btn btn-ghost" onclick="closeModal()" data-zh="取消" data-en="Cancel">取消</button>
  </div>
</div>

<script>
  /* ── 可替换配置区：换行业只改这里 ── */
  const SHOP = { nameZh: '示例奶茶店', nameEn: 'Sample Tea House', currency: '€' };

  // 领券中心的券池
  const COUPONS = [
    { id: 'o1', kind: 'amount', amount: 10, threshold: 50, expiryZh: '2026-09-30 前有效', expiryEn: 'Valid until 2026-09-30' },
    { id: 'o2', kind: 'percent', percent: 9, expiryZh: '2026-09-15 前有效', expiryEn: 'Valid until 2026-09-15' },
    { id: 'o3', kind: 'freebie', labelZh: '免费体验一次', labelEn: 'One Free Trial', expiryZh: '2026-10-31 前有效', expiryEn: 'Valid until 2026-10-31' },
    { id: 'o4', kind: 'amount', amount: 25, threshold: 100, expiryZh: '2026-09-30 前有效', expiryEn: 'Valid until 2026-09-30' },
    { id: 'o5', kind: 'percent', percent: 8, noteZh: '指定项目可用', noteEn: 'Selected items only', expiryZh: '2026-09-20 前有效', expiryEn: 'Valid until 2026-09-20' },
  ];

  // 预置两条记录，只为演示「已使用/已过期」视觉状态，实际接入时删掉即可
  const MY_SEED = [
    { id: 'm1', kind: 'amount', amount: 15, threshold: 80, status: 'used', historyZh: '已于 2026-08-10 使用', historyEn: 'Used on 2026-08-10' },
    { id: 'm2', kind: 'percent', percent: 9, status: 'expired', historyZh: '已于 2026-07-31 过期', historyEn: 'Expired on 2026-07-31' },
  ];

  /* ── 状态 ── */
  let currentLang = 'zh';
  let activeTab = 'center';
  const claimedIds = new Set();
  const myCoupons = [...MY_SEED];
  let redeemTargetId = null;

  function t(zh, en) { return currentLang === 'zh' ? zh : en; }

  /* ── 券面文案生成 ── */
  function couponTitle(c) {
    if (c.kind === 'amount') return t(`满${SHOP.currency}${c.threshold}减${SHOP.currency}${c.amount}`, `${SHOP.currency}${c.amount} off orders over ${SHOP.currency}${c.threshold}`);
    if (c.kind === 'percent') return t(`全场${c.percent}折`, `${percentOff(c.percent)}% off storewide`);
    return t(c.labelZh, c.labelEn);
  }
  // 中文"N折"是倍率（9折=付90%），英文习惯说"减免百分比"，两者不是同一个数字，需要换算
  function percentOff(percent) { return (10 - percent) * 10; }
  function couponAmountBlock(c) {
    if (c.kind === 'amount') return `<div class="amt-num">${SHOP.currency}${c.amount}</div><div class="amt-unit">${t('立减','OFF')}</div>`;
    if (c.kind === 'percent') return currentLang === 'zh'
      ? `<div class="amt-num">${c.percent}<span style="font-size:.9rem">折</span></div><div class="amt-unit">折扣</div>`
      : `<div class="amt-num">${percentOff(c.percent)}%</div><div class="amt-unit">OFF</div>`;
    return `<div class="amt-num" style="font-size:1.1rem">${t('免费','FREE')}</div><div class="amt-unit">${t('体验','TRIAL')}</div>`;
  }
  function couponKindLabel(c) {
    if (c.kind === 'amount') return t('满减券', 'Cash Voucher');
    if (c.kind === 'percent') return t('折扣券', 'Discount Voucher');
    return t('兑换券', 'Redemption Voucher');
  }

  /* ── 渲染：领券中心 ── */
  function renderCenter() {
    const box = document.getElementById('centerList');
    box.innerHTML = COUPONS.map(c => {
      const claimed = claimedIds.has(c.id);
      return `
        <div class="coupon-card">
          <div class="coupon-left">${couponAmountBlock(c)}</div>
          <div class="coupon-right">
            <div class="coupon-title">${couponTitle(c)}</div>
            <div class="coupon-meta">${couponKindLabel(c)}${c.noteZh ? ' · ' + t(c.noteZh, c.noteEn) : ''}</div>
            <div class="coupon-bottom">
              <div class="coupon-expiry">${t(c.expiryZh, c.expiryEn)}</div>
              <button class="coupon-btn" ${claimed ? 'disabled' : ''} onclick="claimCoupon('${c.id}')">
                ${claimed ? t('已领取', 'Claimed') : t('立即领取', 'Claim Now')}
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }
  function claimCoupon(id) {
    if (claimedIds.has(id)) return;
    claimedIds.add(id);
    const source = COUPONS.find(c => c.id === id);
    myCoupons.push({ ...source, id: 'claim-' + id, status: 'unused' });
    renderCenter();
  }

  /* ── 渲染：我的优惠券（按状态分组） ── */
  const STATUS_ORDER = ['unused', 'used', 'expired'];
  const STATUS_LABEL = { unused: ['未使用', 'Unused'], used: ['已使用', 'Used'], expired: ['已过期', 'Expired'] };
  function renderMine() {
    const box = document.getElementById('mineList');
    if (!myCoupons.length) {
      box.innerHTML = `<div class="empty-tip" data-zh="还没有优惠券，去领券中心看看" data-en="No coupons yet — check Get Coupons">还没有优惠券，去领券中心看看</div>`;
      return;
    }
    let html = '';
    STATUS_ORDER.forEach(status => {
      const items = myCoupons.filter(c => c.status === status);
      if (!items.length) return;
      html += `<div class="group-title">${t(STATUS_LABEL[status][0], STATUS_LABEL[status][1])}（${items.length}）</div>`;
      html += items.map(c => renderMyCard(c)).join('');
    });
    box.innerHTML = html;
  }
  function renderMyCard(c) {
    const disabled = c.status !== 'unused';
    return `
      <div class="coupon-card ${disabled ? 'disabled' : ''}">
        ${disabled ? `<div class="stamp">${t(STATUS_LABEL[c.status][0], STATUS_LABEL[c.status][1])}</div>` : ''}
        <div class="coupon-left">${couponAmountBlock(c)}</div>
        <div class="coupon-right">
          <div class="coupon-title">${couponTitle(c)}</div>
          <div class="coupon-meta">${couponKindLabel(c)}${c.noteZh ? ' · ' + t(c.noteZh, c.noteEn) : ''}</div>
          <div class="coupon-bottom">
            <div class="coupon-expiry">${c.status === 'unused' ? t(c.expiryZh, c.expiryEn) : t(c.historyZh, c.historyEn)}</div>
            ${c.status === 'unused' ? `<button class="coupon-btn" onclick="openRedeemModal('${c.id}')">${t('去使用', 'Use Now')}</button>` : ''}
          </div>
        </div>
      </div>
    `;
  }

  /* ── Tab 切换 ── */
  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tabBtn-center').classList.toggle('active', tab === 'center');
    document.getElementById('tabBtn-mine').classList.toggle('active', tab === 'mine');
    document.getElementById('tab-center').classList.toggle('hidden', tab !== 'center');
    document.getElementById('tab-mine').classList.toggle('hidden', tab !== 'mine');
    if (tab === 'center') renderCenter(); else renderMine();
  }

  /* ── 核销弹窗 ── */
  function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
    return h;
  }
  function openRedeemModal(id) {
    redeemTargetId = id;
    const c = myCoupons.find(x => x.id === id);
    document.getElementById('modalCouponTitle').textContent = couponTitle(c);
    document.getElementById('modalCode').textContent = String(Math.abs(hashCode(id))).slice(0, 6).padStart(6, '0');
    document.getElementById('redeemModal').classList.remove('hidden');
  }
  function closeModal() {
    redeemTargetId = null;
    document.getElementById('redeemModal').classList.add('hidden');
  }
  function confirmRedeem() {
    const c = myCoupons.find(x => x.id === redeemTargetId);
    if (c) {
      c.status = 'used';
      c.historyZh = '已于 2026-08-25 使用';
      c.historyEn = 'Used on 2026-08-25';
    }
    closeModal();
    renderMine();
  }

  /* ── 语言切换 ── */
  function toggleLang() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    document.documentElement.lang = currentLang;
    document.getElementById('shopName').textContent = t(SHOP.nameZh, SHOP.nameEn);
    document.querySelectorAll('[data-zh][data-en]').forEach(el => {
      el.textContent = currentLang === 'zh' ? el.dataset.zh : el.dataset.en;
    });
    // 领券中心 / 我的优惠券都是 JS 动态生成的 innerHTML，必须重新渲染才能跟着切语言
    renderCenter();
    renderMine();
    // 核销弹窗若正打开，标题文案也要跟着重渲染（核销码本身不分语言，不用动）
    if (!document.getElementById('redeemModal').classList.contains('hidden') && redeemTargetId) {
      const c = myCoupons.find(x => x.id === redeemTargetId);
      if (c) document.getElementById('modalCouponTitle').textContent = couponTitle(c);
    }
  }

  /* ── 初始化 ── */
  document.getElementById('shopName').textContent = SHOP.nameZh;
  renderCenter();
  renderMine();
</script>
</body>
</html>
