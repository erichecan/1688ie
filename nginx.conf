server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # 容器内部监听 8080，但外部（本地映射端口 / Cloud Run 443）不同，
    # 若不关闭 absolute_redirect，nginx 会把内部端口 8080 写进 Location 头，
    # 导致 /marketing 的 301 跳转在外部不可达。改用相对路径。
    absolute_redirect off;

    location = /salon {
        rewrite ^ /salon.html last;
    }

    # /marketing 子站已下线（2026-08-11），内容并入主站「模块② 让人记住你」。
    # 已被搜索引擎收录的子站 URL 全部 301 到主站对应锚点，不能让它们 404。
    # ^~ 前缀匹配，nginx 取最长前缀，所以 /marketing/en 这条会先于下面那条命中。
    # 主站脚本支持 ?lang=en，英文子站的访客跳过去仍然落在英文界面。
    location ^~ /marketing/en {
        return 301 /?lang=en#module-2;
    }
    location ^~ /marketing {
        return 301 /#module-2;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
