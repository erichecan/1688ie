server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # 容器内部监听 8080，但外部（本地映射端口 / Cloud Run 443）不同，
    # 若不关闭 absolute_redirect，nginx 会把内部端口 8080 写进 Location 头，
    # 导致 /marketing 的 301 跳转在外部不可达。改用相对路径。
    absolute_redirect off;

    location = /salon {
        rewrite ^ /salon.html last;
    }

    # /marketing → /marketing/（规范化，避免相对资源路径错位）
    location = /marketing {
        return 301 /marketing/;
    }

    # /marketing/ 默认出中文版（静态导出无 middleware，locale 路由由此承担）
    location = /marketing/ {
        try_files /marketing/zh/index.html =404;
    }

    # 子站其余路径：命中文件或目录索引，未命中给子站自己的 404
    # 关键：这里不能兜底到主站 /index.html
    # 注意 try_files 的最后一个参数若写成文件路径，返回的是 200 而非 404，
    # 所以用 =404 定状态码，再用 error_page 指定页面
    location /marketing/ {
        try_files $uri $uri/ $uri/index.html =404;
        error_page 404 /marketing/404.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
