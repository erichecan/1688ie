<!DOCTYPE html>
<!--
  行业 demo：美甲/美睫工作室（通用推销版，不绑定具体客户）
  由组件库四块拼装：预约 + 会员 + 积分 + 优惠券（components/booking.html / membership.html / points.html / coupons.html）

  怎么改成具体客户：
  1. 顶部 :root 里的 --brand / --brand-light / --brand-dark 三个变量换成客户品牌色（现在是粉色系）
  2. 全局 SHOP 对象（脚本区最上面）改店名、货币符号
  3. 四个模块各自的 mock 数据（SERVICES/STAFF、TIERS/BENEFITS/MEMBER/RECORDS、PRODUCTS/TRANSACTIONS、COUPONS）按需替换
  4. 文案统一走 data-zh / data-en 双属性，改中文改 data-zh，改英文改 data-en，两个都要改
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<title>示例美甲工作室 · 预约 · 会员 · 积分 · 优惠券</title>
<style>
  /* ── 设计 token：源真值表见 docs/20260917-美甲视觉规范.md ── */
  :root {
    --brand: #A8496B;
    --brand-dark: #7C3A52;
    --brand-deep: #5E2B3E;
    --brand-light: #FDF4F7;
    --brand-tint: #F7E4EC;
    --gold: #C9A227;
    --gold-deep: #8A6E15;
    --ink: #2A1B20;
    --ink-body: #6B5560;
    --gray: #6B5560;          /* 兼容既有选择器，等同 --ink-body */
    --ink-muted: #806C74;
    --ink-faint: #9E8A92;
    --line: #F0DCE4;
    --bg: #FDF4F7;
    --card: #ffffff;
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 20px;
    --danger: #C02636;
    --good: #15803D;
    --warn: #B45309;
    --shadow-sm: 0 1px 2px rgba(42,27,32,.04), 0 8px 20px -16px rgba(42,27,32,.35);
    --shadow-md: 0 2px 4px rgba(42,27,32,.05), 0 20px 40px -24px rgba(42,27,32,.4);
    --font-display: 'Playfair Display', 'Noto Serif SC', Georgia, 'Songti SC', serif;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    padding-bottom: 84px;
  }
  /* 桌面宽屏：480 中轴两侧不再空荡，铺一层品牌氛围底 + 甲片弧线装饰 */
  @media (min-width: 900px) {
    body {
      background:
        radial-gradient(60% 40% at 12% 8%, rgba(168,73,107,.07), transparent 60%),
        radial-gradient(50% 36% at 88% 82%, rgba(201,162,39,.07), transparent 62%),
        var(--bg);
      background-attachment: fixed;
    }
  }
  ::selection { background: var(--brand-tint); color: var(--brand-dark); }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible {
    outline: 2px solid var(--brand-dark); outline-offset: 2px;
  }

  /* ── 共享：确认/核销态胶囊徽标 ── */
  .pow-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; font-weight: 800; font-size: 0.72rem; letter-spacing: .01em;
    color: #fff; background: var(--gray); border-radius: 999px; box-shadow: var(--shadow-sm);
  }

  /* ── 共享：顶部头部（sticky） ── */
  .head-bar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .head-inner { max-width: 480px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .brand-lockup { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto;
    border: 1.5px solid var(--gold); display: flex; align-items: center; justify-content: center;
    color: var(--brand-dark); background: #fff;
  }
  .shop-name {
    font-family: var(--font-display); font-weight: 600; font-size: 1.12rem;
    color: var(--brand-dark); letter-spacing: .005em; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .lang-btn {
    font-size: 0.78rem; font-weight: 700; color: var(--brand-dark);
    border: 1px solid var(--brand); border-radius: 99px;
    padding: 4px 12px; cursor: pointer; background: var(--card);
  }

  /* ── 共享：内容容器 ── */
  main.wrap { max-width: 480px; margin: 0 auto; padding: 16px; }

  /* ── 共享：卡片（四模块通用，样式完全一致） ── */
  .card {
    background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
  }
  .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 12px; color: var(--ink); }
  .card-title .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%; background: var(--brand-dark);
    color: #fff; font-size: 0.72rem; margin-right: 8px;
  }

  .hidden { display: none !important; }

  /* ── 共享：底部 tab 导航（fixed） ── */
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); z-index: 20; }
  .nav-inner { max-width: 480px; margin: 0 auto; display: flex; }
  .nav-item {
    flex: 1; text-align: center; padding: 9px 0 8px; cursor: pointer; color: var(--gray);
    font-size: 11px; font-weight: 700; background: none; border: none; font-family: inherit;
  }
  .nav-item .nav-icon { font-size: 1.3rem; display: block; margin-bottom: 2px; }
  .nav-item.active { color: var(--brand-dark); }

  /* ══════════════ 模块⓪：门店门面（scope: #panelStore） ══════════════ */
  #panelStore .hero {
    position: relative; border-radius: var(--radius-lg); overflow: hidden;
    box-shadow: var(--shadow-md); margin-bottom: 16px; isolation: isolate;
  }
  #panelStore .hero-img { display: block; width: 100%; height: 248px; object-fit: cover; }
  #panelStore .hero-veil {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(42,27,32,.86) 0%, rgba(42,27,32,.52) 42%, rgba(42,27,32,.08) 78%);
  }
  #panelStore .hero-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px; color: #fff; }
  #panelStore .hero-script {
    font-family: var(--font-display); font-style: italic; font-size: .92rem;
    color: #F3D9A6; letter-spacing: .01em; margin-bottom: 4px;
  }
  #panelStore .hero-name {
    font-family: var(--font-display); font-weight: 600; font-size: 1.62rem;
    line-height: 1.16; letter-spacing: -.01em; margin-bottom: 6px;
  }
  #panelStore .hero-tag { font-size: .82rem; opacity: .92; margin-bottom: 12px; }
  #panelStore .hero-rate { display: flex; align-items: center; gap: 6px; font-size: .78rem; margin-bottom: 12px; }
  #panelStore .hero-stars { display: inline-flex; gap: 1px; color: var(--gold); }
  #panelStore .hero-cta {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; color: var(--brand-dark); border: none; border-radius: 999px;
    padding: 10px 20px; font-weight: 800; font-size: .84rem; font-family: inherit;
    cursor: pointer; transition: filter .15s; box-shadow: var(--shadow-sm);
  }
  #panelStore .hero-cta:hover { filter: brightness(.96); }
  #panelStore .hero-cta:active { filter: brightness(.9); }
  /* 金箔点装饰 */
  #panelStore .hero-foil { position: absolute; border-radius: 50%; background: var(--gold); opacity: .55; pointer-events: none; }

  #panelStore .info-strip {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--line); border: 1.5px solid var(--line); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 18px; box-shadow: var(--shadow-sm);
  }
  #panelStore .info-cell { background: var(--card); padding: 12px 8px; text-align: center; }
  #panelStore .info-cell svg { color: var(--brand); margin-bottom: 4px; }
  #panelStore .info-k { font-size: .68rem; color: var(--ink-muted); font-weight: 600; }
  #panelStore .info-v { font-size: .74rem; font-weight: 700; color: var(--ink); margin-top: 1px;
                        white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 400px) { #panelStore .info-v { font-size: .68rem; } }

  #panelStore .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 10px; }
  #panelStore .sec-title { font-family: var(--font-display); font-weight: 600; font-size: 1.18rem; color: var(--ink); }
  #panelStore .sec-more {
    font-size: .74rem; font-weight: 700; color: var(--brand-dark); cursor: pointer;
    background: none; border: none; font-family: inherit; padding: 4px 2px;
  }
  #panelStore .sec-more:hover { text-decoration: underline; }
  #panelStore .sec-wrap { margin-bottom: 20px; }

  #panelStore .svc-card {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px;
    margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm);
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  #panelStore .svc-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--brand-tint); }
  #panelStore .svc-thumb { width: 82px; height: 62px; border-radius: 10px; object-fit: cover; flex: 0 0 auto; }
  #panelStore .svc-info { flex: 1; min-width: 0; }
  #panelStore .svc-t { font-weight: 700; font-size: .9rem; }
  #panelStore .svc-d { font-size: .74rem; color: var(--ink-muted); margin-top: 2px; }
  #panelStore .svc-p { font-weight: 800; color: var(--brand-dark); font-size: .92rem; white-space: nowrap;
                       font-variant-numeric: tabular-nums; }
  #panelStore .svc-go { color: var(--brand); flex: 0 0 auto; }

  #panelStore .staff-strip { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 6px; }
  #panelStore .staff-cell { flex: 0 0 84px; text-align: center; }
  #panelStore .staff-pic {
    width: 66px; height: 66px; border-radius: 50%; object-fit: cover; margin: 0 auto 6px; display: block;
    border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--line), var(--shadow-sm);
  }
  #panelStore .staff-n { font-size: .8rem; font-weight: 700; }
  #panelStore .staff-s { font-size: .68rem; color: var(--ink-muted); line-height: 1.35; margin-top: 1px; }

  #panelStore .gal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #panelStore .gal-item {
    position: relative; border-radius: 10px; overflow: hidden; cursor: pointer;
    aspect-ratio: 1 / 1; box-shadow: var(--shadow-sm); border: none; padding: 0; background: none;
  }
  #panelStore .gal-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  #panelStore .gal-item:hover img { transform: scale(1.06); }
  #panelStore .gal-cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 5px; color: #fff;
    font-size: .66rem; font-weight: 700; text-align: left;
    background: linear-gradient(to top, rgba(42,27,32,.82), transparent);
  }

  #panelStore .rev-card {
    background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow-sm);
  }
  #panelStore .rev-stars { display: inline-flex; gap: 1px; color: var(--gold-deep); margin-bottom: 6px; }
  #panelStore .rev-text { font-family: var(--font-display); font-size: .92rem; line-height: 1.55; color: var(--ink); }
  #panelStore .rev-meta { font-size: .72rem; color: var(--ink-muted); margin-top: 8px; }

  #panelStore .mock-note {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: .7rem; color: var(--ink-muted); line-height: 1.5;
    background: var(--brand-tint); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px;
  }
  #panelStore .mock-note svg { flex: 0 0 auto; margin-top: 1px; color: var(--brand-dark); }

  /* 作品集灯箱 */
  #galLightbox {
    position: fixed; inset: 0; z-index: 40; background: rgba(42,27,32,.82);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #galLightbox img { max-width: min(420px, 90vw); width: 100%; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
  #galLightbox .lb-cap { color: #fff; text-align: center; font-size: .82rem; margin-top: 10px; font-weight: 600; }
  #galLightbox .lb-close {
    position: absolute; top: 18px; right: 18px; width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,.18); border: none; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #galLightbox .lb-close:hover { background: rgba(255,255,255,.3); }

  /* ══════════════ 模块①：预约（scope: #panelBooking） ══════════════ */
  #panelBooking .steps { display: flex; gap: 6px; margin-bottom: 20px; }
  #panelBooking .step-dot { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background .2s; }
  #panelBooking .step-dot.done, #panelBooking .step-dot.active { background: var(--brand); }

  #panelBooking .svc-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; border: 1.5px solid var(--line); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow-sm);
    transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
  }
  #panelBooking .svc-item:last-child { margin-bottom: 0; }
  #panelBooking .svc-item.selected { border-color: var(--brand); background: var(--brand-light); }
  #panelBooking .svc-name { font-weight: 600; font-size: 0.88rem; }
  #panelBooking .svc-meta { font-size: 0.76rem; color: var(--gray); margin-top: 2px; }
  #panelBooking .svc-price { font-weight: 700; color: var(--brand-dark); font-size: 0.9rem; white-space: nowrap; }

  #panelBooking .date-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  #panelBooking .date-cell {
    flex: 0 0 56px; text-align: center; padding: 10px 0; border-radius: 10px;
    border: 1.5px solid var(--line); cursor: pointer; user-select: none;
  }
  #panelBooking .date-cell.selected { border-color: var(--brand-dark); background: var(--brand-dark); color: #fff; }
  #panelBooking .date-cell .dow { font-size: 0.68rem; color: inherit; opacity: .75; }
  #panelBooking .date-cell .dom { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }

  #panelBooking .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #panelBooking .slot-cell {
    text-align: center; padding: 9px 0; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
    border: 1.5px solid var(--line); cursor: pointer;
  }
  #panelBooking .slot-cell.selected { border-color: var(--brand-dark); background: var(--brand-dark); color: #fff; }
  #panelBooking .slot-cell.full { opacity: .3; pointer-events: none; text-decoration: line-through; }

  #panelBooking .staff-row { display: flex; gap: 10px; flex-wrap: wrap; }
  #panelBooking .staff-item { text-align: center; cursor: pointer; padding: 8px 6px; border-radius: 10px; border: 1.5px solid transparent; width: 76px; }
  #panelBooking .staff-item.selected { border-color: var(--brand); background: var(--brand-light); }
  #panelBooking .staff-avatar {
    width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px;
    background: var(--brand-light); color: var(--brand-dark); font-weight: 800;
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
  }
  #panelBooking .staff-name { font-size: 0.74rem; font-weight: 600; }
  #panelBooking .staff-photo { object-fit: cover; border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--line); }

  #panelBooking .field { margin-bottom: 10px; }
  #panelBooking .field label { display: block; font-size: 0.78rem; color: var(--gray); margin-bottom: 5px; font-weight: 600; }
  #panelBooking .field input {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px;
    font-size: 0.88rem; font-family: inherit;
  }
  #panelBooking .field input:focus { outline: none; border-color: var(--brand); }
  #panelBooking .field-error { font-size: 0.74rem; color: var(--danger); margin-top: 4px; display: none; }

  #panelBooking .summary-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 6px 0; }
  #panelBooking .summary-row.total { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; font-weight: 800; font-size: 0.95rem; }
  #panelBooking .btn {
    display: block; width: 100%; text-align: center; padding: 13px; border-radius: 10px;
    font-weight: 700; font-size: 0.92rem; border: none; cursor: pointer;
  }
  #panelBooking .btn-primary { background: var(--brand-dark); color: #fff; transition: filter .15s; }
  #panelBooking .btn-primary:disabled { background: var(--line); color: var(--gray); cursor: not-allowed; }
  #panelBooking .btn-ghost { background: transparent; color: var(--gray); margin-top: 8px; }

  #panelBooking .done-wrap { text-align: center; padding: 30px 10px; }
  #panelBooking .done-icon {
    width: 64px; height: 64px; border-radius: 50%; background: var(--brand-light); color: var(--brand-dark);
    display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 16px;
  }
  #panelBooking .done-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 4px; }
  #panelBooking .done-sub { font-size: 0.84rem; color: var(--gray); margin-bottom: 20px; }
  #panelBooking .code-box {
    background: var(--brand-light); border-radius: 10px; padding: 12px; margin-bottom: 8px;
    font-family: 'SFMono-Regular', Menlo, monospace; font-weight: 700; letter-spacing: 2px; color: var(--brand-dark);
  }

  /* ══════════════ 模块②：会员（scope: #panelMembership） ══════════════ */
  #panelMembership .member-card {
    background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-deep) 100%);
    color: #fff; border-radius: var(--radius); padding: 20px; margin-bottom: 14px;
    box-shadow: var(--shadow-md);
  }
  #panelMembership .member-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  #panelMembership .member-level { font-weight: 800; font-size: 1.1rem; }
  #panelMembership .member-no { font-size: 0.72rem; color: rgba(255,255,255,.98); font-family: 'SFMono-Regular', Menlo, monospace; }
  #panelMembership .member-growth { font-size: 0.8rem; color: rgba(255,255,255,.98); margin: 10px 0 8px; }
  #panelMembership .progress-track { height: 7px; border-radius: 99px; background: rgba(255,255,255,.28); overflow: hidden; }
  #panelMembership .progress-fill { width: 100%; height: 100%; background: #fff; border-radius: 99px; transform-origin: left; transform: scaleX(0); transition: transform .25s; }
  #panelMembership .progress-label { font-size: 0.72rem; color: rgba(255,255,255,.98); margin-top: 8px; }

  #panelMembership .benefit-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  #panelMembership .benefit-item:last-child { border-bottom: none; }
  #panelMembership .benefit-icon {
    flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 0.72rem; margin-top: 1px;
  }
  #panelMembership .benefit-icon.on { background: var(--brand-dark); color: #fff; }
  #panelMembership .benefit-icon.off { background: var(--line); color: #6b5761; }
  #panelMembership .benefit-text { font-size: 0.86rem; font-weight: 600; }
  #panelMembership .benefit-text.off { color: var(--gray); font-weight: 500; }
  #panelMembership .benefit-hint { font-size: 0.72rem; color: var(--gray); margin-top: 2px; }

  #panelMembership .tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  #panelMembership .tier-card {
    position: relative; text-align: center; padding: 10px 4px; border-radius: 12px; font-size: 0.82rem; font-weight: 700;
    border: 2px solid var(--line); background: #fff; cursor: pointer; color: var(--gray); box-shadow: var(--shadow-sm);
    transition: border-color .15s, background .15s, box-shadow .15s, transform .15s, color .15s;
  }
  #panelMembership .tier-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  #panelMembership .tier-card.active { border-color: var(--brand); background: var(--brand-light); color: var(--brand-dark); }
  #panelMembership .tier-name { padding: 0 10px; }
  #panelMembership .tier-radio {
    position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--line); background: #fff; transition: border-color .15s, background .15s, box-shadow .15s;
  }
  #panelMembership .tier-card.active .tier-radio { border-color: var(--brand-dark); background: var(--brand-dark); box-shadow: inset 0 0 0 2px #fff; }

  #panelMembership .record-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  #panelMembership .record-row:last-child { border-bottom: none; }
  #panelMembership .record-name { font-size: 0.86rem; font-weight: 600; }

<script>
  /* ── 全局共享：店铺信息、语言状态 ── */
  const SHOP = { nameZh: '示例美甲工作室', nameEn: 'Sample Nail Studio', currency: '€' };
  let currentLang = 'zh';
  function t(zh, en) { return currentLang === 'zh' ? zh : en; }

  function toggleLang() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    document.documentElement.lang = currentLang;
    document.getElementById('shopName').textContent = t(SHOP.nameZh, SHOP.nameEn);
    document.querySelectorAll('[data-zh][data-en]').forEach(el => {
      el.textContent = currentLang === 'zh' ? el.dataset.zh : el.dataset.en;
    });
    document.querySelectorAll('[data-zh-ph]').forEach(el => {
      el.placeholder = currentLang === 'zh' ? el.dataset.zhPh : el.dataset.enPh;
    });
    Store.onLangChange(currentLang);
    Booking.onLangChange(currentLang);
    Membership.onLangChange(currentLang);
    Points.onLangChange(currentLang);
    Coupons.onLangChange(currentLang);
  }

  function showPanel(name) {
    const ids = { store: 'panelStore', booking: 'panelBooking', membership: 'panelMembership', points: 'panelPoints', coupons: 'panelCoupons' };
    Object.keys(ids).forEach(key => {
      document.getElementById(ids[key]).classList.toggle('hidden', key !== name);
      document.getElementById('nav-' + key).classList.toggle('active', key === name);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button') {
      e.preventDefault();
      e.target.click();
    }
  });

  /* ══════════════ 模块⓪：门店门面（namespace: Store） ══════════════ */
  const Store = (function () {
    /* 展示数据：全部为演示用示意内容，图片来自免费图库（见 assets/nail/CREDITS.md） */
    const HIGHLIGHTS = [
      { id: 's1', zh: '基础美甲', en: 'Classic Manicure', mins: 45, price: 35, img: 'assets/nail/svc-basic.webp',
        dzh: '修型 + 护理 + 单色', den: 'Shaping + care + single colour' },
      { id: 's2', zh: '光疗甲', en: 'Gel Polish', mins: 60, price: 45, img: 'assets/nail/svc-gel.webp',
        dzh: '持久两周不掉色', den: 'Stays flawless for two weeks' },
      { id: 's3', zh: '延长甲 + 手绘', en: 'Extensions + Nail Art', mins: 90, price: 68, img: 'assets/nail/svc-art.webp',
        dzh: '款式可自带图参考', den: 'Bring your own design reference' },
    ];
    const TEAM = [
      { img: 'assets/nail/staff/s1.webp', zh: '阿May',  en: 'May',  szh: '法式 · 手绘',   sen: 'French · Art' },
      { img: 'assets/nail/staff/s2.webp', zh: 'Tina',   en: 'Tina', szh: '延长甲 · 修复', sen: 'Extensions · Repair' },
      { img: 'assets/nail/staff/s3.webp', zh: 'Coco',   en: 'Coco', szh: '日式 · 晕染',   sen: 'Japanese · Ombré' },
      { img: 'assets/nail/staff/s4.webp', zh: '小柔',   en: 'Jaz',  szh: '美睫 · 手部护理', sen: 'Lashes · Hand care' },
    ];
    const GALLERY = [
      { img: 'assets/nail/gallery/g1.webp', zh: '红色手绘',   en: 'Red Lettering' },
      { img: 'assets/nail/gallery/g2.webp', zh: '深蓝金箔',   en: 'Navy & Gold' },
      { img: 'assets/nail/gallery/g3.webp', zh: '玳瑁深色',   en: 'Tortoiseshell' },
      { img: 'assets/nail/gallery/g4.webp', zh: '冬日手绘',   en: 'Winter Art' },
      { img: 'assets/nail/gallery/g5.webp', zh: '法式珠光',   en: 'Pearl French' },
      { img: 'assets/nail/gallery/g6.webp', zh: '金属裸色',   en: 'Nude Chrome' },
    ];
    const REVIEWS = [
      { rating: 5, zh: '第一次来就被细节打动，修型很仔细，做完两周一点没崩。', en: 'The shaping was meticulous — two weeks on and not a single chip.', azh: '林小姐', aen: 'Ms. Lam', date: '08-28' },
      { rating: 5, zh: '提前一天收到短信提醒，到店不用等，小朋友也能一起带着。', en: 'Got a reminder the day before, no waiting on arrival, and kid-friendly too.', azh: 'Aoife', aen: 'Aoife', date: '08-21' },
      { rating: 4, zh: '款式比图片上更好看，就是周末时段比较难约。', en: 'Even prettier than the photos — weekends just book out fast.', azh: '陈太', aen: 'Mrs. Chen', date: '08-14' },
    ];
    const RATING = 4.9, REVIEW_COUNT = 186;

    let currentLang = 'zh';
    function t(zh, en) { return currentLang === 'zh' ? zh : en; }
    function esc(x) { return String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
    function stars(n) {
      return Array.from({ length: 5 }, (_, i) =>
        `<svg width="12" height="12" viewBox="0 0 24 24" fill="${i < n ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.5 6 .7-4.4 4.1 1.2 5.9L12 16.8l-5.4 2.9 1.2-5.9L3.4 9.7l6-.7L12 3.5z"/></svg>`
      ).join('');
    }

    function renderHero() {
      document.getElementById('heroName').textContent = t(SHOP.nameZh, SHOP.nameEn);
      document.getElementById('heroStars').innerHTML = stars(5);
      document.getElementById('heroRateText').textContent =
        t(`${RATING} 分 · ${REVIEW_COUNT} 条评价`, `${RATING} · ${REVIEW_COUNT} reviews`);
    }

    function renderServices() {
      document.getElementById('storeSvcList').innerHTML = HIGHLIGHTS.map(s => `
        <div class="svc-card" role="button" tabindex="0" onclick="Store.goBook('${s.id}')">
          <img class="svc-thumb" src="${s.img}" alt="${esc(t(s.zh, s.en))}" loading="lazy">
          <div class="svc-info">
            <div class="svc-t">${esc(t(s.zh, s.en))}</div>
            <div class="svc-d">${esc(t(s.dzh, s.den))} · ${s.mins} ${t('分钟', 'min')}</div>
          </div>
          <div class="svc-p">${SHOP.currency}${s.price}</div>
          <span class="svc-go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9.5 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </div>
      `).join('');
    }

    function renderTeam() {
      document.getElementById('storeStaffStrip').innerHTML = TEAM.map(m => `
        <div class="staff-cell">
          <img class="staff-pic" src="${m.img}" alt="${esc(t(m.zh, m.en))}" loading="lazy">
          <div class="staff-n">${esc(t(m.zh, m.en))}</div>
          <div class="staff-s">${esc(t(m.szh, m.sen))}</div>
        </div>
      `).join('');
    }

    function renderGallery() {
      document.getElementById('storeGallery').innerHTML = GALLERY.map((g, i) => `
        <button class="gal-item" onclick="Store.openLightbox(${i})">
          <img src="${g.img}" alt="${esc(t(g.zh, g.en))}" loading="lazy">
          <span class="gal-cap">${esc(t(g.zh, g.en))}</span>
        </button>
      `).join('');
    }

    function renderReviews() {
      document.getElementById('storeReviews').innerHTML = REVIEWS.map(r => `
        <div class="rev-card">
          <div class="rev-stars">${stars(r.rating)}</div>
          <div class="rev-text">“${esc(t(r.zh, r.en))}”</div>
          <div class="rev-meta">${esc(t(r.azh, r.aen))} · ${r.date}</div>
        </div>
      `).join('');
    }

    let lbIdx = null;
    function openLightbox(i) {
      lbIdx = i;
      document.getElementById('lbImg').src = GALLERY[i].img;
      document.getElementById('lbImg').alt = t(GALLERY[i].zh, GALLERY[i].en);
      document.getElementById('lbCap').textContent = t(GALLERY[i].zh, GALLERY[i].en);
      document.getElementById('galLightbox').classList.remove('hidden');
    }
    function closeLightbox() {
      lbIdx = null;
      document.getElementById('galLightbox').classList.add('hidden');
    }

    /* 门面 → 预约的联动：带服务 id 时直接选中该项目 */
    function goBook(svcId) {
      showPanel('booking');
      if (svcId) Booking.selectService(svcId);
    }

    function onLangChange(lang) {
      currentLang = lang;
      renderHero(); renderServices(); renderTeam(); renderGallery(); renderReviews();
      if (lbIdx !== null) document.getElementById('lbCap').textContent = t(GALLERY[lbIdx].zh, GALLERY[lbIdx].en);
    }

    function init() { renderHero(); renderServices(); renderTeam(); renderGallery(); renderReviews(); }

    return { goBook, openLightbox, closeLightbox, onLangChange, init };
  })();

  /* ══════════════ 模块①：预约 ══════════════ */
  const Booking = (function () {
    const SERVICES = [
      { id: 's1', zh: '基础美甲', en: 'Classic Manicure', mins: 45, price: 35 },
      { id: 's2', zh: '光疗甲', en: 'Gel Polish', mins: 60, price: 45 },
      { id: 's3', zh: '延长甲 + 手绘', en: 'Extensions + Nail Art', mins: 90, price: 68 },
    ];
    const STAFF = [
      { id: 'p1', zh: '不指定', en: 'No preference', img: null },
      { id: 'p2', zh: '阿May', en: 'May', img: 'assets/nail/staff/s1.webp' },
      { id: 'p3', zh: 'Tina', en: 'Tina', img: 'assets/nail/staff/s2.webp' },
      { id: 'p4', zh: 'Coco', en: 'Coco', img: 'assets/nail/staff/s3.webp' },
      { id: 'p5', zh: '小柔', en: 'Jaz', img: 'assets/nail/staff/s4.webp' },
    ];
    const SLOTS = ['10:00','11:00','12:00','13:30','14:30','15:30','16:30','17:30','18:30'];
    const FULL_SLOTS = ['12:00','16:30'];

    let currentLang = 'zh';
    const state = { service: null, dateIdx: 0, slot: null, staff: STAFF[0].id, name: '', phone: '', code: null };
    function t(zh, en) { return currentLang === 'zh' ? zh : en; }

    function renderServices() {
      const box = document.getElementById('svcList');
      box.innerHTML = SERVICES.map(s => `
        <div class="svc-item ${state.service === s.id ? 'selected' : ''}" role="button" tabindex="0" onclick="Booking.selectService('${s.id}')">
          <div>
            <div class="svc-name">${t(s.zh, s.en)}</div>
            <div class="svc-meta">${s.mins} ${t('分钟', 'min')}</div>
          </div>
          <div class="svc-price">${SHOP.currency}${s.price}</div>
        </div>
      `).join('');
    }
    function selectService(id) { state.service = id; renderServices(); goStep(2); }

    const DOW_ZH = ['日','一','二','三','四','五','六'];
    const DOW_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    function buildDates() {
      const base = { dow: 2, dom: 25 };
      const dates = [];
      for (let i = 0; i < 7; i++) dates.push({ dow: (base.dow + i) % 7, dom: base.dom + i });
      return dates;
    }
    const DATES = buildDates();
    function renderDates() {
      const row = document.getElementById('dateRow');
      row.innerHTML = DATES.map((d, i) => `
        <div class="date-cell ${state.dateIdx === i ? 'selected' : ''}" role="button" tabindex="0" onclick="Booking.selectDate(${i})">
          <div class="dow">${t(DOW_ZH[d.dow], DOW_EN[d.dow])}</div>
          <div class="dom">${d.dom}</div>
        </div>
      `).join('');
    }
    function selectDate(i) { state.dateIdx = i; state.slot = null; renderDates(); renderSlots(); updateStep2Btn(); }

    function renderSlots() {
      const grid = document.getElementById('slotGrid');
      grid.innerHTML = SLOTS.map(s => {
        const full = FULL_SLOTS.includes(s);
        return `<div class="slot-cell ${state.slot === s ? 'selected' : ''} ${full ? 'full' : ''}"
                  ${full ? '' : 'role="button" tabindex="0"'} onclick="${full ? '' : `Booking.selectSlot('${s}')`}">${s}</div>`;
      }).join('');
    }
    function selectSlot(s) { state.slot = s; renderSlots(); updateStep2Btn(); }

    function renderStaff() {
      if (!STAFF.length) { document.getElementById('staffCard').classList.add('hidden'); return; }
      const row = document.getElementById('staffRow');
      row.innerHTML = STAFF.map(p => `
        <div class="staff-item ${state.staff === p.id ? 'selected' : ''}" role="button" tabindex="0" onclick="Booking.selectStaff('${p.id}')">
          ${p.img
            ? `<img class="staff-avatar staff-photo" src="${p.img}" alt="${t(p.zh, p.en)}" loading="lazy">`
            : `<div class="staff-avatar">${t('任','A')}</div>`}
          <div class="staff-name">${t(p.zh, p.en)}</div>
        </div>
      `).join('');
    }
    function selectStaff(id) { state.staff = id; renderStaff(); }

    function updateStep2Btn() { document.getElementById('toStep3Btn').disabled = !(state.slot); }

    function svcById(id) { return SERVICES.find(s => s.id === id); }
    function staffById(id) { return STAFF.find(p => p.id === id); }
    function summaryHTML() {
      const s = svcById(state.service);
      const d = DATES[state.dateIdx];
      const p = staffById(state.staff);
      return `
        <div class="summary-row"><span>${t('服务','Service')}</span><span>${t(s.zh, s.en)}</span></div>
        <div class="summary-row"><span>${t('时间','Time')}</span><span>${d.dom} ${t('日','')} ${state.slot}</span></div>
        ${p ? `<div class="summary-row"><span>${t('技师','Staff')}</span><span>${t(p.zh, p.en)}</span></div>` : ''}
        <div class="summary-row total"><span>${t('预计费用','Estimated Total')}</span><span>${SHOP.currency}${s.price}</span></div>
      `;
    }

    function goStep(n) {
      [1,2,3,4].forEach(i => document.getElementById('step-' + i).classList.toggle('hidden', i !== n));
      document.querySelectorAll('#panelBooking .step-dot').forEach(dot => {
        const i = Number(dot.dataset.step);
        dot.classList.toggle('active', i === n);
        dot.classList.toggle('done', i < n);
      });
      if (n === 2) { renderDates(); renderSlots(); renderStaff(); updateStep2Btn(); }
      if (n === 3) { document.getElementById('summaryBox').innerHTML = summaryHTML(); }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function submitBooking() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const nameOk = name.length > 0;
      const phoneOk = /^[\d+\-\s]{6,}$/.test(phone);
      document.getElementById('errName').style.display = nameOk ? 'none' : 'block';
      document.getElementById('errPhone').style.display = phoneOk ? 'none' : 'block';
      if (!nameOk || !phoneOk) return;

      state.name = name; state.phone = phone;
      state.code = 'BK' + Math.abs(hashCode(name + phone + state.slot)).toString().slice(0, 6);
      document.getElementById('bookingCode').textContent = t('预约码 ', 'Booking Code ') + state.code;
      document.getElementById('finalSummary').innerHTML = summaryHTML();
      goStep(4);
    }
    function hashCode(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
      return h;
    }
    function resetBooking() {
      state.service = null; state.dateIdx = 0; state.slot = null; state.staff = STAFF[0]?.id || null; state.code = null;
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      renderServices();
      goStep(1);
    }

    function onLangChange(lang) {
      currentLang = lang;
      renderServices();
      if (!document.getElementById('step-2').classList.contains('hidden')) { renderDates(); renderSlots(); renderStaff(); }
      if (!document.getElementById('step-3').classList.contains('hidden')) { document.getElementById('summaryBox').innerHTML = summaryHTML(); }
      if (!document.getElementById('step-4').classList.contains('hidden')) {
        document.getElementById('bookingCode').textContent = t('预约码 ', 'Booking Code ') + state.code;
        document.getElementById('finalSummary').innerHTML = summaryHTML();
      }
    }

    function init() { renderServices(); goStep(1); }

    return { selectService, selectDate, selectSlot, selectStaff, goStep, submitBooking, resetBooking, onLangChange, init };
  })();

  /* ══════════════ 模块②：会员 ══════════════ */
  const Membership = (function () {
    const TIERS = [
      { id: 't1', zh: '普通会员', en: 'Basic Member', threshold: 0 },
      { id: 't2', zh: '银卡会员', en: 'Silver Member', threshold: 1000 },
      { id: 't3', zh: '金卡会员', en: 'Gold Member', threshold: 5000 },
    ];
    const BENEFITS = [
      { zh: '生日专属折扣', en: 'Birthday discount', minTierIdx: 0 },
      { zh: '积分兑换商品', en: 'Redeem points for gifts', minTierIdx: 0 },

  const Coupons = (function () {

    const myCoupons = [...MY_SEED];

    function t(zh, en) { return currentLang === 'zh' ? zh : en; }

    function couponTitle(c) {

    function percentOff(percent) { return (10 - percent) * 10; }
    function couponAmountBlock(c) {
      if (c.kind === 'amount') return `<div class="amt-num">${SHOP.currency}${c.amount}</div><div class="amt-unit">${t('立减','OFF')}</div>`;
      if (c.kind === 'percent') return currentLang === 'zh'
        ? `<div class="amt-num">${c.percent}<span style="font-size:.9rem">折</span></div><div class="amt-unit">折扣</div>`

    function couponKindLabel(c) {
      if (c.kind === 'amount') return t('满减券', 'Cash Voucher');
      if (c.kind === 'percent') return t('折扣券', 'Discount Voucher');
      return t('兑换券', 'Redemption Voucher');

              </div>
            </div>
          </div>

      if (claimedIds.has(id)) return;

        return;

      let html = '';

        html += `<div class="group-title">${t(STATUS_LABEL[status][0], STATUS_LABEL[status][1])}${t(`（${items.length}）`, ` (${items.length})`)}</div>`;

            </div>
          </div>
        </div>

      document.getElementById('tab-mine').classList.toggle('hidden', tab !== 'mine');
      if (tab === 'center') renderCenter(); else renderMine();
    }

    function hashCode(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
      return h;
    }
    function openRedeemModal(id) {
      redeemTargetId = id;
      const c = myCoupons.find(x => x.id === id);
      document.getElementById('modalCouponTitle').textContent = couponTitle(c);
      document.getElementById('modalCode').textContent = String(Math.abs(hashCode(id))).slice(0, 6).padStart(6, '0');
      document.getElementById('redeemModal').classList.remove('hidden');
    }
    function closeModal() {
      redeemTargetId = null;
      document.getElementById('redeemModal').classList.add('hidden');
    }
    function confirmRedeem() {
      const c = myCoupons.find(x => x.id === redeemTargetId);
      if (c) {
        c.status = 'used';
        c.historyZh = '已于 2026-08-25 使用';
        c.historyEn = 'Used on 2026-08-25';
      }
      closeModal();
      renderMine();
    }

    function onLangChange(lang) {
      currentLang = lang;
      renderCenter();
      renderMine();

        const c = myCoupons.find(x => x.id === redeemTargetId);
        if (c) document.getElementById('modalCouponTitle').textContent = couponTitle(c);
      }
    }

    function init() { renderCenter(); renderMine(); }

    return { claimCoupon, openRedeemModal, confirmRedeem, closeModal, switchTab, onLangChange, init };
  })();

  document.getElementById('shopName').textContent = SHOP.nameZh;
  Store.init();
