<!DOCTYPE html>
<!--
  场景化销售演示页(Sales Demo Page) · 美容院/SPA · 次卡包版
  跟根目录 sales-demo.html 引擎完全一致，只换了 BRAND 配色 + SCENARIOS 数据，
  渲染代码（renderScreen / render）原封不动照抄，没有新增 screen.kind。

  怎么改成具体客户：
  1. 顶部 :root 里的 --brand / --brand-dark / --brand-light 三个变量换成客户品牌色
  2. 顶部 BRAND 对象改店名、logo
  3. SCENARIOS 数组是唯一数据源，新增/替换场景只改这个数组，不改任何渲染代码
     (screen.kind 目前支持: qr / offer / notify / deduct / balance / auto-list / action / push / sms / booking / confirm)

  角色配色是固定的、独立于品牌色的系统：客人手机=暖橙色，您的手机=深墨蓝色。
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例美容美体中心 · 销售演示</title>
<style>
  :root {
    --brand: #6B8F71;
    --brand-dark: #4A6350;
    --brand-light: #EEF3EE;
    --ink: #1C201D;
    --ink-soft: #667066;
    --bg: #F8FAF8;
    --surface: #ffffff;
    --line: #E4EAE4;
    --radius: 16px;
    --shadow-sm: 0 1px 2px rgba(28,32,29,.04), 0 8px 20px -16px rgba(28,32,29,.35);
    --shadow-md: 0 2px 4px rgba(28,32,29,.05), 0 20px 40px -24px rgba(28,32,29,.4);

    --customer: #EA580C;
    --customer-tint: #FFF3EA;
    --owner: #1E293B;
    --owner-tint: #EEF1F5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  ::selection { background: var(--brand-dark); color: #fff; }
  :focus-visible { outline: 2.5px solid var(--brand); outline-offset: 2px; }

  /* ── 头部 ── */
  .head-bar { background: var(--surface); border-bottom: 1px solid var(--line); }
  .head-inner {
    max-width: 1120px; margin: 0 auto; padding: 18px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .shop-mark {
    width: 40px; height: 40px; border-radius: 12px; background: var(--brand-dark);
    color: #fff; font-weight: 800; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .shop-name { font-weight: 800; font-size: 1.15rem; color: var(--ink); }
  .shop-tag { font-size: 0.82rem; color: var(--ink-soft); margin-top: 1px; }

  /* ── 主体布局 ── */
  main.wrap {
    max-width: 1120px; margin: 0 auto; padding: 28px 24px 60px;
    display: grid; grid-template-columns: 34% 1fr; gap: 28px; align-items: start;
  }

  /* ── 左栏：场景列表 ── */
  .scenario-list { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 24px; }
  .scenario-item {
    text-align: left; background: var(--surface); border: 1.5px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px; cursor: pointer;
    font-family: inherit; box-shadow: var(--shadow-sm);
    transition: border-color .18s, background .18s, box-shadow .18s, transform .18s;
  }
  .scenario-item:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .scenario-item .s-title {
    font-size: 1.02rem; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 8px;
  }
  .scenario-item .s-title .num {
    width: 22px; height: 22px; border-radius: 50%; background: var(--line); color: var(--ink-soft);
    font-size: 0.75rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .scenario-item .s-sub { font-size: 0.86rem; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
  .scenario-item.active { border-color: var(--brand); background: var(--brand-light); box-shadow: var(--shadow-md); }
  .scenario-item.active .s-title .num { background: var(--brand-dark); color: #fff; }
  .scenario-item.active .s-title { color: var(--brand-dark); }

  /* ── 右栏：演示区 ── */
  .stage-panel {
    background: var(--surface); border-radius: 20px;
    padding: 32px; min-height: 560px; display: flex; flex-direction: column;
    box-shadow: var(--shadow-md);
  }
  .stage-head { margin-bottom: 6px; }
  .stage-headline { font-size: 1.25rem; font-weight: 800; color: var(--ink); }
  .stage-punchline {
    margin-top: 10px; font-size: 0.95rem; font-weight: 700; color: var(--brand-dark);
    background: var(--brand-light); border-radius: 10px; padding: 10px 14px; display: inline-block;
  }
  .hidden { display: none !important; }

  /* 步骤条 */
  .step-nav { display: flex; align-items: center; gap: 14px; margin: 22px 0 4px; }
  .step-arrow {
    width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: var(--ink);
    transition: border-color .15s, color .15s, box-shadow .15s;
  }
  .step-arrow:hover:not(:disabled) { border-color: var(--brand); color: var(--brand-dark); box-shadow: var(--shadow-sm); }
  .step-arrow:disabled { opacity: .3; cursor: default; }
  .step-dots { display: flex; gap: 8px; flex: 1; }
  .step-dot {
    flex: 1; height: 5px; border-radius: 4px; background: var(--line); cursor: pointer; border: none; padding: 0;
    transition: background .15s;
  }
  .step-dot.done { background: var(--brand-dark); opacity: .5; }
  .step-dot.active { background: var(--brand); }

  /* 舞台：手机外框 + 周边设计区 */
  .stage-body {
    flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px;
    margin-top: 18px; min-height: 400px;
  }
  .stage-side { display: flex; flex-direction: column; gap: 14px; }
  .stage-side.left { align-items: flex-end; text-align: right; }
  .stage-side.right { align-items: flex-start; text-align: left; }
  .step-index-label {
    font-size: 0.78rem; font-weight: 800; letter-spacing: .04em; color: var(--ink-soft); text-transform: uppercase;
  }
  .step-title { font-size: 1.15rem; font-weight: 800; color: var(--ink); max-width: 220px; }
  .auto-note {
    display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 700;
    color: var(--ink-soft); background: var(--owner-tint); border-radius: 999px; padding: 7px 12px 7px 10px; max-width: 230px;
  }
  .auto-note svg { flex-shrink: 0; }

  .stage-center { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .role-pill {
    display: inline-flex; align-items: center; gap: 7px; font-size: 0.86rem; font-weight: 800;
    border-radius: 999px; padding: 7px 16px; border: 1.5px solid transparent;
  }
  .role-pill.customer { background: var(--customer-tint); color: var(--customer); border-color: var(--customer); }
  .role-pill.owner { background: var(--owner-tint); color: var(--owner); border-color: var(--owner); }

  .phone-halo {
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .phone-halo::before {
    content: ""; position: absolute; width: 260px; height: 260px; border-radius: 50%;
    filter: blur(46px); opacity: .28; z-index: 0; transition: background .2s;
  }
  .phone-halo.customer::before { background: var(--customer); }
  .phone-halo.owner::before { background: var(--owner); }

  .phone-frame {
    position: relative; z-index: 1; width: 300px; aspect-ratio: 9 / 19.3;
    background: #14161a; border-radius: 38px; padding: 9px;
    box-shadow: 0 24px 60px -22px rgba(20,10,15,.4);
    border: 1.5px solid transparent; transition: border-color .2s;
  }
  .phone-frame.customer { border-color: color-mix(in srgb, var(--customer) 55%, transparent); }
  .phone-frame.owner { border-color: color-mix(in srgb, var(--owner) 55%, transparent); }
  .phone-notch {
    position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
    width: 70px; height: 18px; background: #14161a; border-radius: 0 0 14px 14px; z-index: 2;
  }
  .phone-screen {
    width: 100%; height: 100%; background: #fff; border-radius: 29px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .phone-statusbar {
    height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; font-size: 11px; font-weight: 700; color: #111;
  }
  .phone-body { flex: 1; padding: 14px 16px 18px; overflow: hidden; display: flex; flex-direction: column; }

  .screen-fade { animation: screenFade .28s ease; }
  @keyframes screenFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ── 完成态徽章 ── */
  .pow-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; font-weight: 800; font-size: 0.9rem; letter-spacing: .01em;
    color: #fff; background: var(--brand-dark); border-radius: 999px; box-shadow: var(--shadow-sm);
  }

  /* ── 手机屏幕内的通用组件 ── */
  .scr-title { font-size: 0.95rem; font-weight: 800; color: var(--ink); margin-bottom: 10px; }
  .scr-card { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-sm); }
  .scr-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .scr-amount { font-size: 1.5rem; font-weight: 900; color: var(--brand-dark); }
  .scr-amount.pos { color: #15803d; }
  .plan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .plan-grid.single { grid-template-columns: 1fr; }
  .plan-card {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; min-height: 84px; background: #fff; border: 2px solid var(--line); border-radius: 14px;
    padding: 16px 10px; cursor: pointer; text-align: center; box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s, transform .15s, background .15s;
  }
  .plan-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .plan-card.selected { border-color: var(--brand); background: var(--brand-light); }
  .plan-radio {
    position: absolute; top: 10px; right: 10px; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line); background: #fff; transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .plan-card.selected .plan-radio { border-color: var(--brand-dark); background: var(--brand-dark); box-shadow: inset 0 0 0 2.5px #fff; }
  .plan-name { font-weight: 800; font-size: 0.95rem; color: var(--ink); padding: 0 14px; }
  .plan-price { font-size: 0.85rem; font-weight: 800; color: var(--brand-dark); }
  .plan-price.bonus { background: var(--brand-light); border-radius: 999px; padding: 3px 10px; }
  .plan-card.selected .plan-price.bonus { background: #fff; }
  .wallet-card {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #fff; border-radius: 14px; padding: 16px; box-shadow: var(--shadow-md);
  }
  .scr-muted { font-size: 0.8rem; color: var(--ink-soft); }
  .scr-btn {
    margin-top: 12px; background: var(--brand-dark); color: #fff; font-weight: 800; font-size: 0.88rem;
    border: none; border-radius: 10px; padding: 11px; text-align: center;
    transition: filter .15s;
  }
  .scr-btn:hover { filter: brightness(1.06); }
  .scr-btn:active { filter: brightness(.96); }
  .scr-btn.ghost { background: #fff; color: var(--brand-dark); border: 1.5px solid var(--brand); }
  .scr-pill-tag {
    display: inline-block; font-size: 0.72rem; font-weight: 800; border-radius: 999px;
    padding: 3px 10px; background: var(--owner-tint); color: var(--owner);
  }

  /* ── 移动端：左栏折叠为横滑标签条 ── */
  @media (max-width: 860px) {
    main.wrap { grid-template-columns: 1fr; padding: 20px 16px 48px; gap: 18px; }
    .scenario-list {
      position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .scenario-item { flex: 0 0 auto; min-width: 220px; }
    .scenario-list::-webkit-scrollbar { height: 5px; }
    .scenario-list::-webkit-scrollbar-thumb { background: var(--brand); border-radius: 4px; }
    .scenario-list::-webkit-scrollbar-track { background: transparent; }
    .scenario-list { scrollbar-color: var(--brand) transparent; scrollbar-width: thin; }
    .stage-panel { padding: 22px 16px; }
    .stage-body { grid-template-columns: 1fr; gap: 18px; }
    .stage-side.left, .stage-side.right { align-items: center; text-align: center; }
    .stage-side.left { order: 2; }
    .stage-center { order: 1; }
    .stage-side.right { order: 3; }
    .step-title { max-width: none; }
    .phone-frame { width: 260px; }
  }
</style>
</head>
<body>

<header class="head-bar">
  <div class="head-inner">
    <div class="shop-mark" id="shopMark">示</div>
    <div>
      <div class="shop-name" id="shopName">示例美容美体中心</div>
      <div class="shop-tag">给店主看的现场演示 · 不是给客人看的</div>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="scenario-list" id="scenarioList"></nav>

  <section class="stage-panel">
    <div class="stage-head">
      <div class="stage-headline" id="stageHeadline"></div>
      <div class="stage-punchline hidden" id="stagePunchline"></div>
    </div>

    <div class="step-nav">
      <button class="step-arrow" id="prevBtn" aria-label="上一步">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="step-dots" id="stepDots"></div>
      <button class="step-arrow" id="nextBtn" aria-label="下一步">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="stage-body">
      <div class="stage-side left">
        <div>
          <div class="step-index-label" id="stepIndexLabel"></div>
          <div class="step-title" id="stepTitleLeft"></div>
        </div>
      </div>

      <div class="stage-center">
        <span class="role-pill" id="rolePill"></span>
        <div class="phone-halo" id="phoneHalo">
          <div class="phone-frame" id="phoneFrame">
            <div class="phone-notch"></div>
            <div class="phone-screen">
              <div class="phone-statusbar">
                <span>9:41</span>
                <span>●●● ▲ 100%</span>
              </div>
              <div class="phone-body" id="phoneBody"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="stage-side right">
        <div class="auto-note hidden" id="autoNote">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>这一步系统自动做，您不用管</span>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // ══════════════ 唯一数据源：改这里就是改整个页面 ══════════════

  var BRAND = { shopName: '示例美容美体中心', primary: '#6B8F71', logo: null };

  var SCENARIOS = [
    {
      id: 'package',
      label: '让客人一次买一沓',
      subtitle: '做一次就走，下次不知道啥时候回来',
      steps: [
        { title: '客人做完护理，您递手机让她扫码', viewer: 'owner', auto: false,
          screen: { kind: 'qr', caption: '请客人拿出手机扫这个码' } },
        { title: '她的手机上出现疗程卡方案', viewer: 'customer', auto: false,
          screen: { kind: 'offer', options: [ { name: '面部护理 8次卡', price: '€399' }, { name: '单次体验', price: '€59' } ] } },
        { title: '她付款，您的手机收到到账提醒', viewer: 'owner', auto: false,
          screen: { kind: 'notify', title: '到账提醒', line: '客人 购买 面部护理 8次卡', amount: '+€399' } },
        { title: '下次她来，您点一下核销', viewer: 'owner', auto: false,
          screen: { kind: 'deduct', label: '面部护理 8次卡 · 剩余次数', before: '8', after: '7' } }
      ]
    },
    {
      id: 'expiry',
      label: '疗程卡到期前自动提醒',
      subtitle: '疗程卡卖出去了，客人做几次就不来了，钱等于白赚',
      punchline: '快过期的疗程卡自动提醒，钱不会白扔。',
      steps: [
        { title: '系统自动标出快过期的疗程卡', viewer: 'owner', auto: true,
          screen: { kind: 'auto-list', title: '14天内到期 · 未用完', count: '6', unit: '张卡' } },
        { title: '您点一下"发提醒"', viewer: 'owner', auto: false,
          screen: { kind: 'action', label: '发到期提醒', target: '6 位客人' } },
        { title: '她们的手机收到提醒', viewer: 'customer', auto: false,
          screen: { kind: 'push', title: '疗程卡快过期了', body: '您的面部护理卡还剩3次，14天后过期' } },
        { title: '她点开预约，您收到通知', viewer: 'owner', auto: false,
          screen: { kind: 'notify', title: '新预约', line: '陈女士 预约了 明天 15:00', amount: '' } }
      ]
    },
    {
      id: 'handoff',
      label: '员工换班，次数不会算错',
      subtitle: '哪个技师做了几次全靠脑子记，经常对不上账',
      steps: [
        { title: '客人到店，出示她的次卡余额', viewer: 'customer', auto: false,
          screen: { kind: 'balance', name: '身体按摩 5次卡 · 剩余', amount: '3 次' } },
        { title: '不管哪个技师接待，扫码就核销', viewer: 'owner', auto: false,
          screen: { kind: 'deduct', label: '身体按摩 5次卡 · 剩余次数', before: '3', after: '2' } }
      ]
    }
  ];

  // ══════════════ 手机屏幕内容渲染（按 screen.kind 分发，新增场景不用改这里） ══════════════

  function renderScreen(screen) {
    switch (screen.kind) {
      case 'qr':
        return '' +
          '<div class="scr-title">出示收款码</div>' +
          '<div class="scr-card" style="text-align:center;padding:22px 14px;">' +
            '<div style="width:120px;height:120px;margin:0 auto 12px;border-radius:10px;' +
              'background:repeating-linear-gradient(45deg,#20242c,#20242c 6px,#fff 6px,#fff 12px);"></div>' +
            '<div class="scr-muted">' + screen.caption + '</div>' +
          '</div>';
      case 'offer':
        return '' +
          '<div class="scr-title">选一个方案</div>' +
          '<div class="plan-grid' + (screen.options.length === 1 ? ' single' : '') + '">' +
          screen.options.map(function (o, i) {
            var isBonus = o.price.indexOf('送') === 0;
            return '<div class="plan-card' + (i === 0 ? ' selected' : '') + '" onclick="' +
              'this.parentNode.querySelectorAll(\'.plan-card\').forEach(function(c){c.classList.remove(\'selected\');});' +
              'this.classList.add(\'selected\');">' +
              '<span class="plan-radio"></span>' +
              '<span class="plan-name">' + o.name + '</span>' +
              '<span class="' + (isBonus ? 'plan-price bonus' : 'plan-price') + '">' + o.price + '</span>' +
              '</div>';
          }).join('') +
          '</div>' +
          '<div class="scr-btn">立即购买</div>';
      case 'notify':
        return '' +
          '<div class="scr-pill-tag">通知</div>' +
          '<div class="scr-card" style="margin-top:10px;">' +
            '<div class="scr-row"><span style="font-weight:800;">' + screen.title + '</span>' +
            (screen.amount ? '<span class="scr-amount pos">' + screen.amount + '</span>' : '') + '</div>' +
            '<div class="scr-muted" style="margin-top:6px;">' + screen.line + '</div>' +
          '</div>';
      case 'deduct':
        return '' +
          '<div class="scr-title">核销</div>' +
          '<div class="scr-card">' +
            '<div class="scr-muted">' + screen.label + '</div>' +
            '<div class="scr-row" style="margin-top:8px;align-items:baseline;">' +
              '<span style="font-size:1.05rem;color:var(--ink-soft);text-decoration:line-through;">' + screen.before + '</span>' +
              '<span style="font-size:1.4rem;">→</span>' +
              '<span class="scr-amount">' + screen.after + '</span>' +
            '</div>' +
          '</div>' +
          '<div style="text-align:center;margin-top:14px;"><span class="pow-badge">已核销</span></div>';
      case 'balance':
        return '' +
          '<div class="scr-title">次卡余额</div>' +
          '<div class="wallet-card">' +
            '<div class="scr-muted" style="color:rgba(255,255,255,.85);">' + screen.name + '</div>' +
            '<div style="font-size:1.8rem;font-weight:900;margin-top:6px;">' + screen.amount + '</div>' +
          '</div>';
      case 'auto-list':
        return '' +
          '<div class="scr-pill-tag">系统自动</div>' +
          '<div class="scr-card" style="margin-top:10px;text-align:center;padding:20px 10px;">' +
            '<div class="scr-muted">' + screen.title + '</div>' +
            '<div class="scr-amount" style="font-size:2.1rem;margin-top:6px;">' + screen.count + '</div>' +
            '<div class="scr-muted">' + screen.unit + '</div>' +
          '</div>';
      case 'action':
        return '' +
          '<div class="scr-title">' + screen.target + '</div>' +
          '<div class="scr-card scr-muted">已筛选出所有符合条件的客人</div>' +
          '<div class="scr-btn" style="margin-top:14px;">' + screen.label + '</div>';
      case 'push':
        return '' +
          '<div class="scr-pill-tag">推送</div>' +
          '<div class="scr-card" style="margin-top:10px;">' +
            '<div style="font-weight:800;">' + screen.title + '</div>' +
            '<div class="scr-muted" style="margin-top:6px;">' + screen.body + '</div>' +
          '</div>';
      case 'sms':
        return '' +
          '<div class="scr-pill-tag">系统自动 · 短信</div>' +
          '<div class="scr-card" style="margin-top:10px;">' +
            '<div class="scr-muted">' + screen.body + '</div>' +
          '</div>';
      case 'booking':
        return '' +
          '<div class="scr-title">确认预约</div>' +
          '<div class="scr-card">' +
            '<div class="scr-row"><span class="scr-muted">项目</span><span style="font-weight:700;">' + screen.service + '</span></div>' +
            '<div class="scr-row" style="margin-top:8px;"><span class="scr-muted">日期</span><span style="font-weight:700;">' + screen.date + '</span></div>' +
            '<div class="scr-row" style="margin-top:8px;"><span class="scr-muted">时间</span><span style="font-weight:700;">' + screen.time + '</span></div>' +
          '</div>' +
          '<div class="scr-btn">确认预约</div>';
      case 'confirm':
        return '' +
          '<div class="scr-title">明天的预约</div>' +
          '<div class="scr-card scr-muted">14:00 · 面部护理</div>' +
          screen.options.map(function (t, i) {
            return '<div class="scr-btn' + (i === 0 ? '' : ' ghost') + '" style="margin-top:10px;">' + t + '</div>';
          }).join('');
      default:
        return '';
    }
  }

  // ══════════════ 状态与渲染 ══════════════

  var state = { scenarioIndex: 1, stepIndex: 0 }; // 默认选中第2个场景(expiry)

  var $scenarioList = document.getElementById('scenarioList');
  var $stageHeadline = document.getElementById('stageHeadline');
  var $stagePunchline = document.getElementById('stagePunchline');
  var $stepDots = document.getElementById('stepDots');
  var $prevBtn = document.getElementById('prevBtn');
  var $nextBtn = document.getElementById('nextBtn');
  var $stepIndexLabel = document.getElementById('stepIndexLabel');
  var $stepTitleLeft = document.getElementById('stepTitleLeft');
  var $rolePill = document.getElementById('rolePill');
  var $phoneHalo = document.getElementById('phoneHalo');
  var $phoneFrame = document.getElementById('phoneFrame');
  var $phoneBody = document.getElementById('phoneBody');
  var $autoNote = document.getElementById('autoNote');

  function applyBrand() {
    document.documentElement.style.setProperty('--brand', BRAND.primary);
    document.getElementById('shopName').textContent = BRAND.shopName;
    document.getElementById('shopMark').textContent = BRAND.shopName.charAt(0);
    document.title = BRAND.shopName + ' · 销售演示';
  }

  function renderScenarioList() {
    $scenarioList.innerHTML = SCENARIOS.map(function (sc, i) {
      return '<button class="scenario-item' + (i === state.scenarioIndex ? ' active' : '') + '" data-idx="' + i + '">' +
        '<div class="s-title"><span class="num">' + (i + 1) + '</span>' + sc.label + '</div>' +
        '<div class="s-sub">' + sc.subtitle + '</div>' +
      '</button>';
    }).join('');
    Array.prototype.forEach.call($scenarioList.querySelectorAll('.scenario-item'), function (el) {
      el.addEventListener('click', function () {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        if (idx === state.scenarioIndex) return;
        state.scenarioIndex = idx;
        state.stepIndex = 0;
        render();
      });
    });
  }

  function renderStepDots() {
    var scenario = SCENARIOS[state.scenarioIndex];
    $stepDots.innerHTML = scenario.steps.map(function (_, i) {
      var cls = i === state.stepIndex ? 'active' : (i < state.stepIndex ? 'done' : '');
      return '<button class="step-dot ' + cls + '" data-step="' + i + '" aria-label="第' + (i + 1) + '步"></button>';
    }).join('');
    Array.prototype.forEach.call($stepDots.querySelectorAll('.step-dot'), function (el) {
      el.addEventListener('click', function () {
        state.stepIndex = parseInt(el.getAttribute('data-step'), 10);
        render();
      });
    });
  }

  function render() {
    var scenario = SCENARIOS[state.scenarioIndex];
    var step = scenario.steps[state.stepIndex];
    var total = scenario.steps.length;

    // 左栏场景列表高亮
    Array.prototype.forEach.call($scenarioList.querySelectorAll('.scenario-item'), function (el, i) {
      el.classList.toggle('active', i === state.scenarioIndex);
    });

    // 场景标题 / 转化文案
    $stageHeadline.textContent = scenario.label;
    if (scenario.punchline) {
      $stagePunchline.textContent = scenario.punchline;
      $stagePunchline.classList.remove('hidden');
    } else {
      $stagePunchline.classList.add('hidden');
    }

    // 步骤条
    renderStepDots();
    $prevBtn.disabled = state.stepIndex === 0;
    $nextBtn.disabled = state.stepIndex === total - 1;

    // 步骤文字
    $stepIndexLabel.textContent = '第 ' + (state.stepIndex + 1) + ' / ' + total + ' 步';
    $stepTitleLeft.textContent = step.title;

    // 角色徽章 + 光晕 + 手机边框配色
    var role = step.viewer; // 'customer' | 'owner'
    var roleLabel = role === 'customer' ? '客人手机' : '您的手机';
    $rolePill.className = 'role-pill ' + role;
    $rolePill.innerHTML =
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="7" y="2" width="10" height="20" rx="2.5" stroke="currentColor" stroke-width="2"/><line x1="10" y1="18.5" x2="14" y2="18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' +
      '<span>' + roleLabel + '</span>';
    $phoneHalo.className = 'phone-halo ' + role;
    $phoneFrame.className = 'phone-frame ' + role;

    // 自动化提示
    if (step.auto) {
      $autoNote.classList.remove('hidden');
    } else {
      $autoNote.classList.add('hidden');
    }

    // 手机屏幕内容（带轻微过渡动画）
    $phoneBody.classList.remove('screen-fade');
    void $phoneBody.offsetWidth; // 强制重排以重播动画
    $phoneBody.innerHTML = renderScreen(step.screen);
    $phoneBody.classList.add('screen-fade');
  }

  $prevBtn.addEventListener('click', function () {
    if (state.stepIndex > 0) { state.stepIndex--; render(); }
  });
  $nextBtn.addEventListener('click', function () {
    var total = SCENARIOS[state.scenarioIndex].steps.length;
    if (state.stepIndex < total - 1) { state.stepIndex++; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') $prevBtn.click();
    if (e.key === 'ArrowRight') $nextBtn.click();
  });

  applyBrand();
  renderScenarioList();
  render();
})();
</script>
</body>
</html>
